name: Static Linting

on:
    pull_request:
    push:
        branches:
            - trunk

jobs:
    php:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3
            - name: Install dependencies
              uses: php-actions/composer@v6
            - name: Lint PHP files
              run: composer run lint

        name: PHP Files

    other:
        runs-on: ubuntu-latest

        steps:
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm i

            - name: Lint JavaScript files
              run: npm run lint:js
              env:
                  CI: true

        name: Javascript
